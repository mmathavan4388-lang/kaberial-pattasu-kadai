# One-click deploy: Render > New > Blueprint > pick this repo.
databases:
  - name: mavrix-db
    plan: free
    databaseName: mavrix
services:
  - type: web
    name: mavrix-fire
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: mavrix-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN        # shown in Render > Environment; use it on /admin/setup
        generateValue: true
      - key: PUBLIC_URL
        value: https://mavrix-fire.onrender.com
      - key: REQUIRE_MOBILE_VERIFICATION   # no SMS provider yet
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
